name: Build Android APK
# Rebuild approved Rail Wear Calculator UI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name railway_rail_wear_calculator .
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Convert low fail horn to Android-safe MP3
        run: |
          ffmpeg -y -i "assets/TRNHorn_Train horn 3 (ID 2847)_BigSoundBank.com (1).wav" -codec:a libmp3lame -b:a 192k "assets/low-fail-horn.mp3"
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Railway-Rail-Wear-Calculator-APK
          path: build/app/outputs/flutter-apk/app-release.apk
